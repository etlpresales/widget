<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnyChat Widget Local Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      background: #eef6ff;
      border: 1px solid #cfe4ff;
      border-radius: 8px;
    }

    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AnyChat Widget Test Page</h1>

    <p>
      This page is being used to test the AnyChat widget locally.
      If the widget loads correctly, you should see the chat/contact widget
      appear on the page, usually near one of the screen corners.
    </p>

    <div class="status">
      <strong>Widget script loaded:</strong>
      <span id="widget-status">Checking...</span>
    </div>

    <p style="margin-top: 24px;">
      Current page URL:
      <code id="current-url"></code>
    </p>
  </div>

  <script>
    document.getElementById('current-url').textContent = window.location.href;
  </script>

  <!-- AnyChat Widget -->
  <script>
    (function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];

      if (d.getElementById(id)) return;

      js = d.createElement(s);
      js.id = id;

      js.src =
        'https://api.anychat.one/widget/c6f4894c-7ce8-32b2-b73f-c47b686fba58?r=' +
        encodeURIComponent(window.location);

      js.onload = function() {
        document.getElementById('widget-status').textContent =
          'Yes - AnyChat JavaScript loaded successfully.';
      };

      js.onerror = function() {
        document.getElementById('widget-status').textContent =
          'Failed to load. Check browser Console / Network tab.';
      };

      fjs.parentNode.insertBefore(js, fjs);

    }(document, 'script', 'contactus-jssdk'));
  </script>
</body>
</html>
